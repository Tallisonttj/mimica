<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Mímica / Palavras</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h1 { font-size: 1.5rem; margin-bottom: 20px; }
        .palavra-box {
            background: #2d2d2d;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            font-size: 1.2rem;
        }
        #cronometro {
            font-size: 2.5rem;
            margin: 20px 0;
            font-weight: bold;
            color: #4CAF50;
        }
        button {
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            transition: 0.2s;
        }
        button.parar {
            background-color: #d9534f;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Desafio de Palavras</h1>
        
        <div id="cronometro">00:00</div>

        <div class="palavra-box">
            <strong>Futebol:</strong> <span id="futebol">-</span>
        </div>
        <div class="palavra-box">
            <strong>Objeto:</strong> <span id="objeto">-</span>
        </div>
        <div class="palavra-box">
            <strong>Figura:</strong> <span id="figura">-</span>
        </div>

        <br>
        <button id="btn-acao" onclick="alternarJogo()">Iniciar</button>
    </div>

    <script>
        const API_URL = 'https://mimica-rqz7.onrender.com/api/sortear';
        let timerInterval;
        let rodando = false;

        function alternarJogo() {
            const botao = document.getElementById('btn-acao');
            const cronometroEl = document.getElementById('cronometro');

            if (!rodando) {
                // --- INICIAR ---
                rodando = true;
                botao.textContent = "Parar / Reiniciar";
                botao.classList.add('parar');

                // Busca as palavras na API do Render
                fetch(API_URL)
                    .then(res => res.json())
                    .then(data => {
                        document.getElementById('futebol').textContent = `${data.futebol.palavra} (${data.futebol.nivel})`;
                        document.getElementById('objeto').textContent = `${data.objeto.palavra} (${data.objeto.nivel})`;
                        document.getElementById('figura').textContent = `${data.figura.palavra} (${data.figura.nivel})`;

                    })
                    .catch(err => {
                        console.error('Erro ao conectar na API:', err);
                        alert('Erro ao buscar palavras no servidor.');
                        pararJogo();
                    });

                // Inicia o cronômetro regressivo (ex: 60 segundos)
                let tempo = 60;
                timerInterval = setInterval(() => {
                    let min = Math.floor(tempo / 60);
                    let seg = tempo % 60;
                    cronometroEl.textContent = `${min < 10 ? '0' + min : min}:${seg < 10 ? '0' + seg : seg}`;
                    
                    if (tempo-- < 0) {
                        clearInterval(timerInterval);
                        cronometroEl.textContent = "Tempo Esgotado!";
                        pararJogo();
                    }
                }, 1000);

            } else {
                // --- PARAR / REINICIAR A QUALQUER MOMENTO ---
                pararJogo();
            }
        }

        function pararJogo() {
            clearInterval(timerInterval);
            rodando = false;
            
            const botao = document.getElementById('btn-acao');
            botao.textContent = "Iniciar";
            botao.classList.remove('parar');
            
            document.getElementById('cronometro').textContent = "00:00";
            document.getElementById('futebol').textContent = "-";
            document.getElementById('objeto').textContent = "-";
            document.getElementById('figura').textContent = "-";
            document.getElementById('placas').textContent = "-";
        }
    </script>
</body>
</html>
